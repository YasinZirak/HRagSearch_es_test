services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: es-learning
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # OK only because port 9200 is localhost-only
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: bike-app
    restart: unless-stopped
    env_file: .env
    environment:
      - ES_URL=http://elasticsearch:9200
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata: